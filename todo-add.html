<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>To-do Add</title>
		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<h2>To-do Add</h2>
		<p id="debug"></p>
		<div class="block-center">
			<div id="userDisplay">
				<a href="login.html">Login</a>
			</div>

			<p>
				<span id="page-message">Enter fields and click Save</span>
			</p>
			<p>
				<span class="error-head">* required field.</span>
			</p>
			<form id="todoForm" onsubmit="submitForm(event)">
				Name: <input type="text" id="listName"/>
				<span id="nameErr" class="error">* </span>
				<input type="submit" name="submit" value="Save"/>
			</form>
			<form action="todo-list.html" method="get">
				<button type="submit">Cancel</button>
			</form>
		</div>
	</body>

	<script src="./js/todo-add.js"></script>
	</html>
